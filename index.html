Glosarium SMC PFSO



IDM (Inducement)Umpan likuiditas pullback terdekat yang wajib disapu atau di-Break Out sebelum titik High atau Low dinyatakan valid.
HV & LV (High / Low Valid)Batas puncak dan lembah struktur pasar yang terkunci secara mekanis pasca pengambilan IDM.
Pullback CTC (Candle-to-Candle)Pembacaan kerangka zig-zag murni dengan menyaring Inside Bar agar struktur terbaca jernih tanpa bias warna candle.
Strong FVG (Fair Value Gap)Ketidakseimbangan harga tiga candle dengan persentase kekuatan dominasi buyer/seller untuk memvalidasi zona pantulan.
Zona Buta (Black Zona / TP1)Area keseimbangan tengah (equilibrium) sebagai target aman TP1 sekaligus area larangan membuka posisi baru.
Sniper 1 & Sniper 2 ABCPemetaan 3 lapisan titik entry (a, b, c). Sniper 1 untuk koreksi (Contra Trend) dan Sniper 2 searah tren utama (Follow Trend).

function hitungFibo() {
const hv = parseFloat(document.getElementById('hvInput').value) || 0;
const lv = parseFloat(document.getElementById('lvInput').value) || 0;
const bias = document.getElementById('biasInput').value;
const range = hv - lv;
document.getElementById('zTopA').innerText = hv.toFixed(2);
document.getElementById('zTopB').innerText = (lv + range * 0.886).toFixed(2);
document.getElementById('zTopC').innerText = (lv + range * 0.786).toFixed(2);
document.getElementById('zBlindHigh').innerText = (lv + range * 0.618).toFixed(2);
document.getElementById('zMid').innerText = (lv + range * 0.50).toFixed(2);
document.getElementById('zBlindLow').innerText = (lv + range * 0.382).toFixed(2);
document.getElementById('zBotC').innerText = (lv + range * 0.214).toFixed(2);
document.getElementById('zBotB').innerText = (lv + range * 0.114).toFixed(2);
document.getElementById('zBotA').innerText = lv.toFixed(2);
if (bias === 'bearish') {
document.getElementById('topZoneTitle').innerText = 'ZONA SNIPER 2 (FOLLOW TREND SELL — PREMIUM)';
document.getElementById('botZoneTitle').innerText = 'ZONA SNIPER 1 (CONTRA TREND BUY — DISCOUNT)';
} else {
document.getElementById('topZoneTitle').innerText = 'ZONA SNIPER 1 (CONTRA TREND SELL — PREMIUM)';
document.getElementById('botZoneTitle').innerText = 'ZONA SNIPER 2 (FOLLOW TREND BUY — DISCOUNT)';
}
}

function filterGlosarium() {
const q = document.getElementById('searchGlosarium').value.toLowerCase();
document.querySelectorAll('.glos-card').forEach(card => {
card.style.display = card.innerText.toLowerCase().includes(q) ? 'block' : 'none';
});
}
